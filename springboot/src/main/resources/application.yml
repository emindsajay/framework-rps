server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
  tomcat:
    threads:
      max: ${APP_CONCURRENCY:50}
      min-spare: ${APP_CONCURRENCY:50}
    accept-count: 1000
    max-connections: 8192

spring:
  application:
    name: rps-springboot
  main:
    banner-mode: off
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_DATABASE:rps}
    username: ${DB_USERNAME:rps}
    password: ${DB_PASSWORD:rps}
    hikari:
      maximum-pool-size: ${APP_CONCURRENCY:50}
      minimum-idle: ${APP_CONCURRENCY:50}
      pool-name: rps
      initialization-fail-timeout: 60000

logging:
  level:
    root: WARN
