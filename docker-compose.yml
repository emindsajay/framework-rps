name: rps-bench

# Each application gets the same CPU and memory budget.
# APP_CONCURRENCY is the shared cap of 50 PostgreSQL connections:
#   Laravel  -> PHP-FPM workers and one persistent connection per worker
#   Spring   -> Tomcat threads and Hikari pool size
#   Node.js  -> two Express processes, splitting the pool evenly
#   Fastify  -> two Fastify processes, splitting the pool evenly
#   Bun      -> two Bun.serve processes, splitting the pool evenly
#   FastAPI  -> two Uvicorn workers, splitting the pool evenly
#   Go       -> one process, GOMAXPROCS 2, database/sql pool of 50

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: rps
      POSTGRES_PASSWORD: rps
      POSTGRES_DB: rps
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=256MB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rps -d rps"]
      interval: 2s
      timeout: 3s
      retries: 30
    cpus: 1.0
    mem_limit: 1g

  laravel:
    build:
      context: ./laravel
    environment:
      APP_NAME: Laravel
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: "base64:Tzw5O15QDUVRfQbHSPSHjmEWP5LVL0WSXtc9ajWpkp4="
      APP_URL: http://localhost
      APP_CONCURRENCY: "50"
      LOG_CHANNEL: stderr
      LOG_LEVEL: warning
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: rps
      DB_USERNAME: rps
      DB_PASSWORD: rps
      CACHE_STORE: file
      SESSION_DRIVER: file
      QUEUE_CONNECTION: sync
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:80"
    cpus: 2.0
    mem_limit: 2g
    init: true
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/api/ping | grep -q ok"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 40s

  springboot:
    build:
      context: ./springboot
    environment:
      APP_CONCURRENCY: "50"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: rps
      DB_USERNAME: rps
      DB_PASSWORD: rps
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    cpus: 2.0
    mem_limit: 2g
    init: true
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/api/ping | grep -q ok"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s

  nodejs:
    build:
      context: ./nodejs
    environment:
      WEB_CONCURRENCY: "2"
      APP_CONCURRENCY: "50"
      PORT: "3000"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: rps
      DB_USERNAME: rps
      DB_PASSWORD: rps
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3001:3000"
    cpus: 2.0
    mem_limit: 2g
    init: true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/api/ping').then(async (response) => { const body = await response.text(); if (!response.ok || !body.includes('ok')) process.exit(1); }).catch(() => process.exit(1))
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  fastify:
    build:
      context: ./fastify
    environment:
      WEB_CONCURRENCY: "2"
      APP_CONCURRENCY: "50"
      PORT: "3000"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: rps
      DB_USERNAME: rps
      DB_PASSWORD: rps
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3002:3000"
    cpus: 2.0
    mem_limit: 2g
    init: true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/api/ping').then(async (response) => { const body = await response.text(); if (!response.ok || !body.includes('ok')) process.exit(1); }).catch(() => process.exit(1))
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  bun:
    build:
      context: ./bun
    environment:
      WEB_CONCURRENCY: "2"
      APP_CONCURRENCY: "50"
      PORT: "3000"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: rps
      DB_USERNAME: rps
      DB_PASSWORD: rps
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3003:3000"
    cpus: 2.0
    mem_limit: 2g
    init: true
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - fetch('http://127.0.0.1:3000/api/ping').then(async (response) => { const body = await response.text(); if (!response.ok || !body.includes('ok')) process.exit(1); }).catch(() => process.exit(1))
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  fastapi:
    build:
      context: ./fastapi
    environment:
      WEB_CONCURRENCY: "2"
      APP_CONCURRENCY: "50"
      PORT: "8000"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: rps
      DB_USERNAME: rps
      DB_PASSWORD: rps
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8010:8000"
    cpus: 2.0
    mem_limit: 2g
    init: true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; body = urllib.request.urlopen('http://127.0.0.1:8000/api/ping').read(); raise SystemExit(0 if b'ok' in body else 1)
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  golang:
    build:
      context: ./golang
    environment:
      GOMAXPROCS: "2"
      APP_CONCURRENCY: "50"
      PORT: "8081"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: rps
      DB_USERNAME: rps
      DB_PASSWORD: rps
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8090:8081"
    cpus: 2.0
    mem_limit: 2g
    init: true
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8081/api/ping | grep -q ok"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  k6:
    image: grafana/k6:2.3.0
    profiles: ["benchmark"]
    user: "0:0"
    volumes:
      - ./k6:/scripts:ro
      - ./results:/results
